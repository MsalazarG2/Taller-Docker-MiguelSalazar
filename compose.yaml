services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: prestamos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prestamos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PRESTAMOS_DB_URL: postgresql+psycopg://postgres:postgres@db:5432/prestamos
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
